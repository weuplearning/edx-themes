<div class="carousel-container">
    <div class="prev fa fa-angle-left" onclick="moveSlide(-1)"></div>

    <div class="carousel-slide">

        <div class="vignette"></div>
        <div class="vignette"> </div>
        <div class="vignette"> </div>
        <div class="vignette"> </div>
        <div class="vignette"> </div>

    </div>

    <div class="next fa fa-angle-right" onclick="moveSlide(1)"></div>
</div>

<style>
.carousel-container {
    position: relative;
    width: 85%;
    height: 100%;
    max-width: 1200px;
    overflow: hidden;
    margin: 30px auto;
}
.carousel-slide {
    display: flex;
    align-items: center;
    width: 166%;
    height: 120%;
    transition: transform 0.5s ease-in-out;
}
.carousel-slide .vignette {
    width: 20%;
    position: relative;
    height: 312px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0px 10px;
    border-radius: 14px;
    color: orange;
    padding: 20px;
    background-image: url("${static.url('max-havelaar/images/module_1.png')}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center bottom;
}
.carousel-slide .vignette:nth-child(2) {
    background-image: url("${static.url('max-havelaar/images/module_2.png')}");
}
.carousel-slide .vignette:nth-child(3) {
    background-image: url("${static.url('max-havelaar/images/module_3.png')}");
}
.carousel-slide .vignette:nth-child(4) {
    background-image: url("${static.url('max-havelaar/images/module_4.png')}");
}
.carousel-slide .vignette:nth-child(5) {
    background-image: url("${static.url('max-havelaar/images/module_5.png')}");
}


.prev, .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    border-radius: 7px;
    z-index: 9;
}
.prev {
    left: 10px;
}
.next {
    right: 10px;
}
.prev:hover, .next:hover {
    background-color: rgba(0, 0, 0, 0.8);
}




@media screen and (max-width: 768px) {
    .carousel-slide {
        height: 80%;
    }
    #top-container {
        height: 200px;
        padding: 20px;
    }
    .next {
        right: 30px;
    }
}
</style>

<script>
const carouselSlide = document.querySelector('.carousel-slide');
// const vignettes = document.querySelectorAll('.carousel-slide .vignette');
const vignettes = [0, 1];

let counter = 0;
let size = carouselSlide.clientWidth / 2.5; // 5 vignettes total / on avance de 2 vignettes 

window.addEventListener('resize', () => {
    size = carouselSlide.clientWidth / 2.5;
    carouselSlide.style.transform = 'translateX(' + (-size * counter) + 'px)';
});

function moveSlide(direction) {
    if (direction === 1 && counter >= vignettes.length - 1) {
        counter = -1;
    } else if (direction === -1 && counter <= 0) {
        counter = vignettes.length;
    }   

    carouselSlide.style.transition = 'transform 0.5s ease-in-out';
    counter += direction;
    carouselSlide.style.transform = 'translateX(' + (-size * counter) + 'px)';
}

// function startCarousel() {
//     carouselSlide.style.transform = 'translateX(' + (-size * counter) + 'px)';

//     setInterval(() => {
//         moveSlide(1);
//     }, 2500);
// }

// setTimeout(() => {
//     startCarousel();
// }, 3700);
</script>
